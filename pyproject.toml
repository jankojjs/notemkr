[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notemkr"
version = "0.1.0"
description = "MP3 -> notni zapis (MIDI/MusicXML) za harmoniku, sa razdvajanjem leve i desne ruke."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "notemkr" }]
keywords = ["accordion", "harmonika", "transcription", "midi", "musicxml", "basic-pitch"]

# Zavisnosti su pinovane radi reproducibilnosti na Mac i Windows (Python 3.11+).
# basic-pitch koristi ONNX backend (onnxruntime) umesto TensorFlow radi lakseg pakovanja.
dependencies = [
    "basic-pitch==0.4.0",
    "onnxruntime==1.17.3",
    "librosa==0.10.2.post1",
    "pretty_midi==0.2.10",
    "mido==1.3.2",
    "music21==9.1.0",
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "python-multipart==0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "ruff==0.5.0",
]

[project.scripts]
notemkr = "notemkr.server:main"

[project.urls]
Homepage = "https://example.invalid/notemkr"

[tool.setuptools]
packages = ["notemkr"]

[tool.ruff]
line-length = 100
target-version = "py311"
