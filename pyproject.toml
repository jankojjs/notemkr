[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notemkr"
version = "0.1.0"
description = "MP3 -> notni zapis (MIDI/MusicXML) za harmoniku, sa razdvajanjem leve i desne ruke."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "notemkr" }]
keywords = ["accordion", "harmonika", "transcription", "midi", "musicxml", "basic-pitch"]

# Opsezi (a ne tacni pinovi) jer paket mora da se instalira na Python 3.11-3.13,
# na Mac-u i na Windows-u; tacni pinovi za 3.11 nemaju wheel-ove za 3.13.
#
# `basic-pitch` NAMERNO nije ovde: njegovi metapodaci tvrdo zahtevaju TensorFlow
# (Windows/py>=3.11) odnosno tensorflow-macos (macOS/py>3.11), sto je suprotno
# zahtevu "samo onnxruntime". U kodu koristi ONNX backend i tada mu TF ne treba,
# pa se instalira posebno, bez zavisnosti (vidi README):
#     pip install --no-deps basic-pitch==0.4.0
# Zbog toga su ovde navedene i prave runtime zavisnosti basic-pitch-a
# (numpy, scipy, resampy, mir_eval, librosa, pretty_midi).
dependencies = [
    "onnxruntime>=1.20,<2",
    "librosa>=0.10.2,<0.12",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    # 0.4.2 na uvozu trazi `pkg_resources`, kojeg u praznom Python 3.13 venv-u
    # (setuptools >= 81) vise nema — 0.4.3 ga je izbacio. basic-pitch u metapodacima
    # trazi <0.4.3, ali se instalira sa --no-deps pa to ogranicenje ionako ne vazi.
    "resampy>=0.4.3,<0.5",
    "mir_eval>=0.7,<0.9",
    "pretty_midi>=0.2.11,<0.3", # 0.2.10 puca na py3.12+ (koristi pkg_resources)
    "mido>=1.3,<2",
    "music21>=9.1,<10",
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
    "httpx>=0.27,<1",  # fastapi.testclient (TestClient) ga zahteva
]
# Samo za pravljenje .exe paketa (vidi packaging/ i README sekciju "Pakovanje").
build = [
    "pyinstaller>=6.6,<8",
]

[project.scripts]
notemkr = "notemkr.server:main"
notemkr-transcribe = "notemkr.cli:main"

[project.urls]
Homepage = "https://example.invalid/notemkr"

[tool.setuptools]
packages = ["notemkr"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Eksplicitan izbor pravila, da lint bude isti bez obzira na verziju ruff-a.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
